version: '3.8'

services:
  docker-in-docker:
    image: docker:dind
    container_name: 'docker_dind'
    privileged: 'true'
    extra_hosts:
      - "${FORGEJO_DOMAIN}:${FORGEJO_IP}"
    command: ['dockerd', '-H', 'tcp://0.0.0.0:2375', '--tls=false']
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "DOCKER_HOST=tcp://127.0.0.1:2375 docker info >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: 'unless-stopped'

  runner:
    image: 'data.forgejo.org/forgejo/runner:13'
    links:
      - docker-in-docker
    depends_on:
      docker-in-docker:
        condition: service_healthy
    container_name: 'runner'
    environment:
      DOCKER_HOST: tcp://docker-in-docker:2375
    # User without root privileges, but with access to `./data`.
    user: 1000:1000
    volumes:
      - forgejo-runner-data:/data
    extra_hosts:
      - "${FORGEJO_DOMAIN}:${FORGEJO_IP}"
    restart: 'unless-stopped'
    # command: ["sleep", "infinity"]
    command: 'forgejo-runner daemon --config /data/config.yml'

volumes:
  forgejo-runner-data: